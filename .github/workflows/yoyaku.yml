name: 空き枠チェック

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき(GitHubの都合で数分〜十数分遅れることがある)
    # 平日の夕方は張り付きモード。GitHubは予定通りに動かへんことが多いから、何回も起こしとく
    - cron: "47 8 * * 1-5"  # 17:47(日本時間)
    - cron: "7 9 * * 1-5"   # 18:07
    - cron: "27 9 * * 1-5"  # 18:27
    - cron: "47 9 * * 1-5"  # 18:47
    - cron: "7 10 * * 1-5"  # 19:07
    - cron: "17 10 * * 1-5" # 19:17
  workflow_dispatch:
    inputs:
      test_line:
        description: "LINEにテスト通知を送る"
        type: boolean
        default: false
      test_booking:
        description: "予約テスト(入力まで。送信はしない)"
        type: boolean
        default: false
      unbook_day:
        description: "キャンセルした日をまた狙う(例: 11/12 、全部なら all)"
        type: string
        default: ""
      booked_day:
        description: "自分で予約した日(ボットに取らせへん。例: 11/30)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 予定に入った時点やなく、動き出した時点の最新の記録を使う

      - name: 準備
        run: pip install --quiet playwright

      - name: 空き枠をチェック
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          BOOK_LAST: ${{ secrets.BOOK_LAST }}
          BOOK_FIRST: ${{ secrets.BOOK_FIRST }}
          BOOK_PHONE: ${{ secrets.BOOK_PHONE }}
          BOOK_EMAIL: ${{ secrets.BOOK_EMAIL }}
          TEST_LINE: ${{ github.event.inputs.test_line }}
          TEST_BOOKING: ${{ github.event.inputs.test_booking }}
          UNBOOK_DAY: ${{ github.event.inputs.unbook_day }}
          BOOKED_DAY: ${{ github.event.inputs.booked_day }}
        run: python3 check.py

      - name: 記録を保存
        if: always()
        run: |
          git config user.name "checker-bot"
          git config user.email "checker-bot@users.noreply.github.com"
          git add state.json log.md || true
          git commit -m "記録を更新" || true
          # ほかの実行が先に記録を更新してても、それに重ねて保存する(失敗を黙って捨てへん)
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            sleep 3
          done
          echo "記録の保存に失敗した" && exit 1
